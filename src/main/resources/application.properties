spring.application.name=bookverse-api
spring.datasource.url=jdbc:h2:mem:bookverse;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
 # permet a spring de charger data.sql
spring.jpa.defer-datasource-initialization=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
#server.servlet.context-path=/rest/api
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=INFO
management.endpoints.web.exposure.include=*
management.endpoints.health.show-details=always
#Parametrage d'un profil utilisateur par defaut
server.port=8080